[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "original-repo-detector"
version = "1.0.0"
description = "Check whether GitHub records a repository as the original, a fork, or generated from a template."
requires-python = ">=3.9"
dependencies = ["certifi"]

[project.scripts]
original-repo-detector = "original_repo_detector.cli:main"

[tool.setuptools]
packages = ["original_repo_detector"]
